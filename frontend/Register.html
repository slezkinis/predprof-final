<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <!-- Подключение CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

    <form class="register" id="registerForm">
        <h1 class="title">Зарегистрировать пользователя</h1>
        
        <div class="input_text">
            <label for="email">Электронная почта</label>
            <input id="email" name="email" type="email" placeholder="Введите email" class="input" required>
        </div>

        <div class="input_text">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="Введите пароль" class="input" required>
        </div>

        <div class="input_text">
            <label for="name">Имя</label>
            <input id="name" name="name" type="text" placeholder="Введите имя" class="input" required>
        </div>

        <div class="input_text">
            <label for="lastname">Фамилия</label>
            <input id="lastname" name="lastname" type="text" placeholder="Введите фамилию" class="input" required>
        </div>

        <div class="error_message" id="errorMessage"></div>

        <button type="submit" class="register_button">Зарегистрировать</button>
        
        <!-- Ссылка на вход, если нужна -->
        <!-- <a href="/login" class="link">Уже есть аккаунт? Войти</a> -->
    </form>

    <!-- Подключение JS -->
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
